<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c0a0c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Журнал"><style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style></head><body>
<title>Журнал записи салона</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Слева меню (на телефоне снизу). Главная: гайд → 4 плитки цифр → расписание сегодня + напоминания на завтра + неделя. */
:root{
  --bg:#0c0a0c; --panel:#151116; --card:#1c171d; --card2:#251e26; --fg:#f6eef4; --muted:#9d8c98; --line:#2e2530;
  --pink:#ff4f9a; --violet:#a23bff; --pink-soft:rgba(255,79,154,.14); --on:#ffffff;
  --ok:#3fd294; --warn:#f5bd4f; --bad:#ff6b6b;
  --grad:linear-gradient(135deg,#ff4f9a 0%,#b03cff 100%);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset;
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif; color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f6f3f7; --panel:#ffffff; --card:#ffffff; --card2:#f7f0f6; --fg:#1d1520; --muted:#857784; --line:#ece2ea;
  --pink:#e2287f; --violet:#8f2ee6; --pink-soft:#fde6f1; --on:#ffffff;
  --ok:#1c9a62; --warn:#b67a08; --bad:#d63b3b;
  --grad:linear-gradient(135deg,#ec3a8c 0%,#9b33f0 100%);
  --shadow:0 1px 2px rgba(60,20,50,.05),0 6px 20px rgba(60,20,50,.05); color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* каркас */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:6px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;padding:4px 10px 18px}
.logo i{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#fff;font-style:normal;font-size:16px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:11px 12px;border-radius:12px;font-weight:600;color:var(--muted);text-align:left;min-height:44px}
.nav button .ic{width:20px;text-align:center;font-size:16px}
.nav button[aria-current="true"]{background:var(--pink-soft);color:var(--pink)}
.nav .badge{margin-left:auto;background:var(--pink);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px}
.aside-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
main{min-width:0;padding-block:24px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head .t{flex:1;min-width:200px}
.head h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.02em;text-wrap:balance}
.head p{margin:2px 0 0;color:var(--muted);text-transform:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:9px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:14px;text-decoration:none;white-space:nowrap}
.btn.main{background:var(--grad);border:0;color:var(--on);box-shadow:0 6px 18px rgba(200,50,160,.28)}
.btn.wa{background:#25d366;border-color:#25d366;color:#05301a}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px;border-radius:10px}
.icon{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:17px}

/* плитки */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow);min-width:0}
.tile .l{font-size:12.5px;color:var(--muted);font-weight:600}
.tile .v{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.tile .s{font-size:12.5px;color:var(--muted)}
.tile.hero{background:var(--grad);border:0;color:#fff}
.tile.hero .l,.tile.hero .s{color:rgba(255,255,255,.82)}
.bar{height:6px;border-radius:6px;background:var(--card2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--grad);border-radius:6px}

/* панели */
.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h2{font-size:16px;margin:0;font-weight:800}
.panel .ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel .ph h2{flex:1}
.panel .sub{color:var(--muted);font-size:13px;margin:-8px 0 0}

/* гайд */
.guide{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;position:relative;box-shadow:var(--shadow)}
.guide .gh{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.guide .gh h2{margin:0;font-size:16px;font-weight:800;flex:1}
.step{background:var(--card2);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.step b{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--grad);color:#fff;font-size:13px}
.step h3{margin:4px 0 0;font-size:14.5px}
.step p{margin:0;color:var(--muted);font-size:13px}

/* расписание */
.sched{display:flex;flex-direction:column}
.slot{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;align-items:stretch;padding:5px 0}
.slot .tm{font-weight:700;color:var(--muted);font-size:13px;padding-top:12px}
.free{border:1px dashed var(--line);border-radius:12px;min-height:40px;background:transparent;color:var(--muted);font-size:13px;text-align:left;padding:0 12px}
.free:hover{border-color:var(--pink);color:var(--pink)}
.appt{border-radius:14px;padding:11px 12px;background:var(--card2);border-left:4px solid var(--muted);display:flex;flex-direction:column;gap:8px;min-width:0}
.appt.ok,.appt.done{border-left-color:var(--ok)} .appt.sent,.appt.silent{border-left-color:var(--warn)} .appt.cancel,.appt.noshow{border-left-color:var(--bad)} .appt.new{border-left-color:var(--pink)}
.appt .r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.appt .n{font-weight:700;flex:1;min-width:120px;overflow-wrap:anywhere}
.appt .n small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.appt .note{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.st{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap;background:var(--card)}
.st.new{color:var(--pink)} .st.sent,.st.silent{color:var(--warn)} .st.ok,.st.done{color:var(--ok)} .st.cancel,.st.noshow{color:var(--bad)}
.empty{color:var(--muted);text-align:center;padding:26px 12px;border:1px dashed var(--line);border-radius:16px;display:flex;flex-direction:column;gap:10px;align-items:center}

/* неделя и месяц */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dy{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:64px}
.dy .w{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.dy .d{font-weight:800;font-size:16px}
.dy .c{font-size:11px;color:var(--pink);font-weight:700;min-height:14px}
.dy[aria-pressed="true"]{background:var(--grad);border-color:transparent;color:#fff}
.dy[aria-pressed="true"] .w,.dy[aria-pressed="true"] .c{color:rgba(255,255,255,.9)}
.dy.today .d{text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--pink)}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.month .wd{font-size:11px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.05em;padding-bottom:2px}
.month .dy{min-height:58px}
.month .dy.out{opacity:.35}
.mh{display:flex;align-items:center;gap:8px}
.mh h2{flex:1;text-transform:capitalize}

/* напоминания */
.rem{display:flex;flex-direction:column;gap:8px}
.ritem{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:14px;padding:10px 12px;flex-wrap:wrap}
.ritem .tm{font-weight:800;color:var(--pink);min-width:46px}
.ritem .n{flex:1;min-width:100px;font-weight:700;overflow-wrap:anywhere}
.tip{background:var(--pink-soft);border-radius:14px;padding:12px 14px;font-size:13px}
.tip b{color:var(--pink)}

/* клиенты, тексты */
.cl{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.cc{background:var(--card2);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.cc .top{display:flex;align-items:center;gap:10px}
.av{width:40px;height:40px;border-radius:12px;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:4px 9px;border-radius:999px;background:var(--card);color:var(--muted)}
.chip.ok{color:var(--ok)} .chip.bad{color:var(--bad)} .chip.warn{color:var(--warn)} .chip.pink{color:var(--pink)}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
input,textarea,select{min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-size:16px;width:100%;font-weight:500}
textarea{resize:vertical}
.preview{background:#0b141a;color:#e9edef;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.bubble{align-self:flex-end;background:#005c4b;border-radius:10px 10px 2px 10px;padding:8px 10px;max-width:85%;font-size:14px}

/* лист формы, тост, мобильная навигация */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet .box{background:var(--card);border:1px solid var(--line);width:100%;max-width:520px;border-radius:22px;max-height:92vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slots{display:flex;flex-wrap:wrap;gap:6px}
.slots button{min-height:38px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-size:13.5px}
.slots button[aria-pressed="true"]{background:var(--grad);color:#fff;border-color:transparent}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:90%}
.mnav{display:none}
.fab{display:none}

@media (max-width:1000px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr)}
  aside{display:none}
  main{padding-block:14px 110px}
  .head h1{font-size:22px}
  .head .desk{display:none}
  .guide{grid-template-columns:minmax(0,1fr)}
  .tile .v{font-size:26px}
  .mnav{display:block;position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--panel);border-top:1px solid var(--line);
    padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .mnav .in{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
  .mnav button{min-height:52px;border:0;background:transparent;border-radius:12px;font-size:11px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .mnav button span{font-size:18px}
  .mnav button[aria-current="true"]{color:var(--pink);background:var(--pink-soft)}
  .fab{display:block;position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(78px + env(safe-area-inset-bottom,0px));
    height:54px;padding:0 20px;border-radius:27px;border:0;background:var(--grad);color:#fff;font-weight:800;font-size:15px;box-shadow:0 8px 24px rgba(200,50,160,.4);z-index:6}
  .sheet{align-items:flex-end;padding:0}
  .sheet .box{border-radius:22px 22px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="shell">
  <aside>
    <div class="logo"><i>✂</i>Мой журнал</div>
    <div class="nav" id="nav"></div>
    <div class="aside-foot">
      <button class="btn main" type="button" id="addSide">+ Новая запись</button>
      <button class="btn ghost" type="button" id="themeSide">Светлая тема</button>
    </div>
  </aside>
  <main><div class="wrap" id="view"></div></main>
</div>
<button class="fab" id="fab" type="button">+ Запись</button>
<nav class="mnav"><div class="in" id="mnav"></div></nav>
<div id="sheetHost"></div>

<script>
/* ================= данные ================= */
const DEF = { reminder:"Labvakar! Atgādinu par rītdienas pierakstiņu pulksten {laiks}.", thanks:"Paldies, uz tikšanos! ;)", cc:"371", from:"09:00", to:"20:00" };
const ST = { new:"Записан", sent:"Напомнила", ok:"Подтвердил", silent:"Не ответил", cancel:"Не сможет", done:"Пришёл", noshow:"Не пришёл" };
let appts=[], settings={...DEF}, db=null, mode="local";
const LS="salon-journal-v1";
const get=(k,d)=>{ try{ const v=localStorage.getItem(LS+"-"+k); return v==null?d:v; }catch(e){ return d; } };
const put=(k,v)=>{ try{ localStorage.setItem(LS+"-"+k,v); }catch(e){} };
function lsLoad(){ try{ const j=JSON.parse(localStorage.getItem(LS)||"{}"); appts=j.appts||[]; settings={...DEF,...(j.settings||{})}; }catch(e){} }
function lsSave(){ try{ localStorage.setItem(LS,JSON.stringify({appts,settings})); }catch(e){} }
async function saveAppt(a){
  a.updatedAt=Date.now();
  const i=appts.findIndex(x=>x.id===a.id); i<0?appts.push(a):(appts[i]=a);
  lsSave(); render();
  if(db){ try{ const {id,...r}=a; await db.collection("appts").doc(id).set(r); }catch(e){ toast("Нет связи с облаком. Запись сохранена на этом устройстве."); } }
}
async function delAppt(id){
  appts=appts.filter(x=>x.id!==id); lsSave(); render();
  if(db){ try{ await db.collection("appts").doc(id).delete(); }catch(e){} }
}
async function saveSettings(){ lsSave(); if(db){ try{ await db.doc("settings/main").set(settings); }catch(e){} } }

/* ================= утилиты ================= */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const D=s=>new Date(s+"T12:00:00");
const addDays=(s,n)=>{ const d=D(s); d.setDate(d.getDate()+n); return iso(d); };
const today=()=>iso(new Date());
const tomorrow=()=>addDays(today(),1);
const fmt=(s,o)=>D(s).toLocaleDateString("ru-RU",o);
const long=s=>fmt(s,{weekday:"long",day:"numeric",month:"long"});
const rel=s=>s===today()?"Сегодня":s===tomorrow()?"Завтра":s===addDays(today(),-1)?"Вчера":"";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function waNum(p){ let d=(p||"").replace(/\D/g,""); if(!d) return ""; if(d.startsWith("00")) d=d.slice(2); if(d.length<=8) d=(settings.cc||"371")+d; return d; }
const waLink=(p,t)=>`https://wa.me/${waNum(p)}?text=${encodeURIComponent(t)}`;
const remText=a=>settings.reminder.replace(/\{laiks\}/g,a.time);
const dayList=d=>appts.filter(a=>a.date===d).sort((a,b)=>a.time.localeCompare(b.time));
const cnt=(l,...k)=>l.filter(a=>k.includes(a.status)).length;
function el(t,at={},...kids){
  const e=document.createElement(t);
  for(const [k,v] of Object.entries(at)){ if(k==="class") e.className=v; else if(k.startsWith("on")) e[k]=v; else if(v!==false&&v!=null) e.setAttribute(k,v); }
  kids.flat().forEach(k=>{ if(k!=null&&k!==false) e.append(k.nodeType?k:String(k)); });
  return e;
}
function toast(m){ const t=el("div",{class:"toast",role:"status"},m); document.body.append(t); setTimeout(()=>t.remove(),2600); }
const initials=n=>(n||"?").trim().split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase();

/* ================= навигация ================= */
const TABS=[
  {k:"home",ic:"⌂",t:"Главная"},
  {k:"cal",ic:"▦",t:"Календарь"},
  {k:"remind",ic:"✉",t:"Напомнить"},
  {k:"clients",ic:"☺",t:"Клиенты"},
  {k:"settings",ic:"⚙",t:"Настройки"},
];
let tab=get("tab","home"); if(!TABS.some(t=>t.k===tab)) tab="home";
let sel=today(), monthCur=today().slice(0,7);
function setTab(t){ tab=t; put("tab",t); render(); window.scrollTo(0,0); }
function drawNav(){
  const pend=dayList(tomorrow()).filter(a=>a.status==="new").length;
  const mk=(t,mob)=>{
    const b=el("button",{type:"button","aria-current":String(tab===t.k),onclick:()=>setTab(t.k)},
      mob?el("span",{},t.ic):el("span",{class:"ic"},t.ic), t.t,
      (!mob&&t.k==="remind"&&pend)?el("span",{class:"badge num"},pend):null);
    return b;
  };
  const n=document.getElementById("nav"); n.innerHTML=""; TABS.forEach(t=>n.append(mk(t,false)));
  const m=document.getElementById("mnav"); m.innerHTML=""; TABS.forEach(t=>m.append(mk(t,true)));
}

/* ================= общие блоки ================= */
function head(title,sub,...right){
  return el("div",{class:"head"},el("div",{class:"t"},el("h1",{},title),sub?el("p",{},sub):null),...right);
}
function statusActions(a){
  const acts=el("div",{class:"acts"});
  if(a.date<=today() && !["done","noshow","cancel"].includes(a.status)){
    acts.append(el("button",{class:"btn sm",type:"button",onclick:()=>saveAppt({...a,status:"done"})},"✓ Пришёл"),
                el("button",{class:"btn sm",type:"button",onclick:()=>saveAppt({...a,status:"noshow"})},"Не пришёл"));
  }
  acts.append(el("button",{class:"btn sm ghost",type:"button",onclick:()=>openForm(a)},"Изменить"));
  return acts;
}
function apptCard(a){
  return el("div",{class:"appt "+a.status},
    el("div",{class:"r"},
      el("div",{class:"n"},a.name||"Без имени",a.phone?el("small",{},a.phone):null),
      el("span",{class:"st "+a.status},ST[a.status]||"")),
    a.note?el("div",{class:"note"},a.note):null,
    statusActions(a));
}
function schedule(d,compact){
  const list=dayList(d), box=el("div",{class:"sched"});
  const [fh,fm]=settings.from.split(":").map(Number), [th,tm]=settings.to.split(":").map(Number);
  const times=new Set(); for(let m=fh*60+fm;m<=th*60+tm;m+=30) times.add(`${pad(Math.floor(m/60))}:${pad(m%60)}`);
  list.forEach(a=>times.add(a.time));
  const nowT=`${pad(new Date().getHours())}:${pad(new Date().getMinutes())}`;
  [...times].sort().forEach(t=>{
    const here=list.filter(a=>a.time===t);
    if(compact && !here.length) return;
    if(!here.length && d===today() && t<nowT) return;
    box.append(el("div",{class:"slot"},el("div",{class:"tm num"},t),

    if(!name.value.trim()&&!phone.value.trim()){ toast("Впишите имя или телефон"); return; }
    saveAppt({...a,date:date.value,time:time.value,name:name.value.trim(),phone:phone.value.trim(),note:note.value.trim()});
    sel=date.value; monthCur=sel.slice(0,7); close(); toast("Клиент записан");
  };
  const sh=el("div",{class:"sheet",onclick:e=>{ if(e.target===sh) close(); }},box);
  host.innerHTML=""; host.append(sh); setTimeout(()=>(a.name?time:name).focus(),50);
}

/* ================= тема ================= */
let theme=get("theme","dark");
function applyTheme(){ document.documentElement.setAttribute("data-theme",theme); document.getElementById("themeSide").textContent=theme==="dark"?"Светлая тема":"Тёмная тема"; }
function toggleTheme(){ theme=theme==="dark"?"light":"dark"; put("theme",theme); applyTheme(); render(); }

/* ================= рендер ================= */
function render(){
  drawNav();
  const v=document.getElementById("view"); v.innerHTML="";
  ({home:vHome,cal:vCal,remind:vRemind,clients:vClients,settings:vSettings})[tab](v);
  document.getElementById("fab").hidden = tab==="settings";
}
document.getElementById("addSide").onclick=()=>openForm({});
document.getElementById("fab").onclick=()=>openForm({date: tab==="remind"?tomorrow():(tab==="cal"?sel:today())});
document.getElementById("themeSide").onclick=toggleTheme;
applyTheme(); lsLoad(); render();

(async()=>{
  try{ db=await window.claude?.use?.("db"); }catch(e){ db=null; }
  if(!db) return;
  mode="cloud";
  db.collection("appts").onSnapshot(snap=>{
    const cloud=snap.docs.map(d=>({id:d.id,...d.data()}));
    const ids=new Set(cloud.map(x=>x.id));
    appts.filter(a=>!ids.has(a.id)).forEach(a=>{ const {id,...r}=a; db.collection("appts").doc(id).set(r).catch(()=>{}); cloud.push(a); });
    appts=cloud; lsSave(); if(!document.querySelector(".sheet")) render();
  },()=>{ mode="local"; });
  db.doc("settings/main").onSnapshot(s=>{ if(s.exists){ settings={...DEF,...s.data()}; lsSave(); if(tab!=="settings") render(); } },()=>{});
})();
